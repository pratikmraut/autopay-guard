name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/api/pom.xml

      - name: Verify API
        id: maven_verify
        working-directory: services/api
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress verify

      - name: Annotate failing Maven tests
        if: ${{ failure() && steps.maven_verify.outcome == 'failure' }}
        continue-on-error: true
        working-directory: services/api
        shell: bash
        run: |
          python3 - <<'PY'
          from itertools import chain, islice
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          REPORT_DIRS = (
              Path("target/surefire-reports"),
              Path("target/failsafe-reports"),
          )
          MAX_REPORTS = 200
          MAX_REPORT_BYTES = 2 * 1024 * 1024
          MAX_ANNOTATIONS = 50

          class_cleaner = re.compile(r"[^A-Za-z0-9_.$]")
          method_prefix = re.compile(r"[A-Za-z_$][A-Za-z0-9_$]*")

          def local_name(tag):
              return tag.rsplit("}", 1)[-1]

          def safe_class_name(value):
              cleaned = class_cleaner.sub("_", value or "")[:160]
              return cleaned or "unknown_class"

          report_stream = chain.from_iterable(
              directory.glob("TEST-*.xml") for directory in REPORT_DIRS
          )
          reports = list(islice(report_stream, MAX_REPORTS + 1))
          report_limit_hit = len(reports) > MAX_REPORTS
          reports = reports[:MAX_REPORTS]

          failures = []
          skipped_report = False

          for report in reports:
              try:
                  with report.open("rb") as handle:
                      raw = handle.read(MAX_REPORT_BYTES + 1)
              except OSError:
                  skipped_report = True
                  continue

              upper = raw.upper()
              if (
                  len(raw) > MAX_REPORT_BYTES
                  or b"<!DOCTYPE" in upper
                  or b"<!ENTITY" in upper
              ):
                  skipped_report = True
                  continue

              try:
                  root = ET.fromstring(raw)
              except ET.ParseError:
                  skipped_report = True
                  continue

              for testcase in root.iter():
                  if local_name(testcase.tag) != "testcase":
                      continue

                  failed = any(
                      local_name(child.tag) in {"failure", "error"}
                      for child in testcase
                  )
                  if not failed:
                      continue

                  class_name = safe_class_name(testcase.get("classname"))
                  match = method_prefix.match(testcase.get("name") or "")
                  method_name = match.group(0)[:120] if match else "unknown_test"
                  failures.append(f"{class_name}#{method_name}")

          unique_failures = list(dict.fromkeys(failures))

          for failure in unique_failures[:MAX_ANNOTATIONS]:
              print(f"::error title=Maven test failure::{failure}")

          omitted = len(unique_failures) - MAX_ANNOTATIONS
          if omitted > 0:
              print(
                  "::notice title=Maven test annotations::"
                  f"{omitted} additional failing tests omitted"
              )

          if not unique_failures:
              print(
                  "::notice title=Maven verify failed::"
                  "No failing Surefire or Failsafe testcase entries were available"
              )

          if skipped_report or report_limit_hit:
              print(
                  "::notice title=Maven test annotations::"
                  "Some report files were omitted by parsing safety limits"
              )
          PY

  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js 22.19
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run frontend tests
        run: pnpm test

      - name: Verify generated API client
        run: pnpm contracts:check

      - name: Build frontend
        run: pnpm build

  e2e:
    name: Real OIDC Playwright smoke
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/api/pom.xml

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js 22.19
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Create isolated local configuration
        env:
          AUTOPAY_GUARD_SKIP_INSTALL: "1"
        run: make bootstrap

      - name: Install workspace and browser dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Start and validate the local stack
        run: |
          make up
          make seed

      - name: Run real OIDC smoke
        env:
          E2E_EXTERNAL_SERVER: "true"
        run: make e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-diagnostics
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 1

      - name: Stop local stack
        if: always()
        run: make down
