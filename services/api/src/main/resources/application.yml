spring:
  application:
    name: autopay-guard-api
  servlet:
    multipart:
      max-file-size: 256KB
      max-request-size: 320KB
      file-size-threshold: 320KB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/autopay_guard}
    username: ${SPRING_DATASOURCE_USERNAME:autopay_guard}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    test-connection: false
    properties:
      mail:
        debug: false
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: ${SPRING_MAIL_CONNECTION_TIMEOUT_MS:3000}
          timeout: ${SPRING_MAIL_READ_TIMEOUT_MS:5000}
          writetimeout: ${SPRING_MAIL_WRITE_TIMEOUT_MS:5000}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  identity:
    auto-provision: false
    require-verified-email: true
  privacy:
    notice-version: ${PRIVACY_NOTICE_VERSION:foundation-v1}
  occurrences:
    reconcile-cron: ${OCCURRENCE_RECONCILE_CRON:0 17 2 * * *}
  imports:
    expiry-delay-ms: ${IMPORT_EXPIRY_DELAY_MS:60000}
    fingerprint-key: ${IMPORT_FINGERPRINT_KEY}
  rate-limit:
    cleanup-delay-ms: ${RATE_LIMIT_CLEANUP_DELAY_MS:3600000}
    cleanup-initial-delay-ms: ${RATE_LIMIT_CLEANUP_INITIAL_DELAY_MS:3600000}
  notifications:
    generator-cron: "${NOTIFICATION_GENERATOR_CRON:-}"
    worker-cron: "${NOTIFICATION_WORKER_CRON:-}"
    reconciliation-cron: "${NOTIFICATION_RECONCILIATION_CRON:-}"
    batch-size: ${NOTIFICATION_BATCH_SIZE:25}
    lease-duration: ${NOTIFICATION_LEASE_DURATION:PT2M}
    catch-up-window: ${NOTIFICATION_CATCH_UP_WINDOW:PT2H}
    email:
      mode: ${NOTIFICATION_EMAIL_MODE:DISABLED}
      from-address: ${NOTIFICATION_FROM_ADDRESS:no-reply@autopayguard.local}
      allowed-recipient-suffixes: ${NOTIFICATION_ALLOWED_RECIPIENT_SUFFIXES:@autopayguard.local,.example.test}
  security:
    issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/autopay-guard}
    jwk-set-uri: ${OIDC_JWK_SET_URI:}
    audience: ${OIDC_AUDIENCE:autopay-guard-api}
    authorized-party: ${OIDC_AUTHORIZED_PARTY:autopay-guard-web}
    outbound-allowed-origins: ${API_OUTBOUND_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
    version: OPENAPI_3_0
  explicit-object-schema: true
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: method
  show-actuator: false

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    in.autopayguard.api: INFO
    org.springframework.security: WARN
    org.springframework.mail: WARN
    org.eclipse.angus.mail: WARN
